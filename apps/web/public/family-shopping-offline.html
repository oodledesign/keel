<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#351E28" />
    <title>Shopping</title>
    <style>
      :root {
        --canvas: #fbf6ec;
        --panel: #ffffff;
        --text: #2a1720;
        --muted: #7a6670;
        --border: rgba(42, 23, 32, 0.1);
        --accent: #059669;
      }

      html.dark {
        --canvas: #351e28;
        --panel: #2a1720;
        --text: #fbf6ec;
        --muted: #b7a4ac;
        --border: rgba(251, 246, 236, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--canvas);
        color: var(--text);
        font-family:
          'General Sans',
          ui-sans-serif,
          system-ui,
          -apple-system,
          sans-serif;
        padding: 1.5rem 1rem 3rem;
      }

      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .lede,
      .meta,
      .hint,
      .empty {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .lede {
        margin: 0.25rem 0 1.25rem;
      }

      .meta {
        margin: 0 0 1rem;
        font-size: 0.75rem;
      }

      .status {
        color: var(--text);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 1rem;
        box-shadow:
          0 1px 2px rgba(42, 23, 32, 0.04),
          0 3px 10px rgba(42, 23, 32, 0.05);
      }

      .add-row {
        display: flex;
        gap: 0.5rem;
        padding: 0.75rem;
        margin-bottom: 1rem;
      }

      input[type='text'] {
        flex: 1;
        min-width: 0;
        height: 2.25rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--canvas);
        color: var(--text);
        padding: 0 0.75rem;
        font: inherit;
      }

      button {
        height: 2.25rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0 0.85rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      .add-btn {
        background: var(--accent);
        color: #fbf6ec;
      }

      .section + .section {
        border-top: 1px solid var(--border);
      }

      .section {
        padding: 0.85rem 1rem;
      }

      .section h2 {
        margin: 0 0 0.5rem;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      label.item {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 0.35rem 0.25rem;
        cursor: pointer;
      }

      label.item.checked {
        opacity: 0.6;
      }

      label.item.checked span {
        text-decoration: line-through;
      }

      input[type='checkbox'] {
        margin-top: 0.2rem;
        accent-color: var(--accent);
      }

      .empty,
      .hint {
        padding: 1.25rem;
        text-align: center;
      }

      .hint {
        margin-top: 1rem;
        background: transparent;
        border: 0;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main data-test="shopping-offline-fallback">
      <h1>Shopping</h1>
      <p class="lede">Your last list, saved on this device.</p>
      <p class="meta" id="meta"></p>
      <div id="add-row" class="panel add-row" hidden>
        <input
          id="add-input"
          type="text"
          placeholder="e.g. 2 onions"
          autocomplete="off"
        />
        <button class="add-btn" id="add-button" type="button">Add</button>
      </div>
      <div id="list" class="panel"></div>
      <p class="hint">
        Ticks and new items stay on this device until you are back online.
      </p>
    </main>
    <script src="/family-shopping-offline.js" defer></script>
  </body>
</html>
